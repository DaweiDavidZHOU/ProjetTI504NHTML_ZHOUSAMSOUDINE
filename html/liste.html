<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toutes les recettes - Recettes du Monde</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <header>
        <div class="header-contenu">
            <a href="index.html" class="logo">🌍 Recettes du Monde</a>
            <nav class="navigation-principale">
                <a href="index.html">Accueil</a>
                <a href="carte.html">Carte du Monde</a>
                <a href="liste.html" class="actif">Toutes les recettes</a>
                <a href="stats.html">Top Recettes</a>
                <a href="aPropos.html">À propos</a>
            </nav>
        </div>
    </header>

    <main>
        <h1 class="page-titre">📖 Toutes les recettes</h1>

        <!-- 🔍 Barre de recherche et filtres -->
        <div class="section-filtres">
            <input type="text" id="recherche" placeholder="Rechercher une recette..." class="champ-recherche">
            
            <div class="groupe-filtres">
                <select id="filtre-pays" class="select-filtre">
                    <option value="">Tous les pays</option>
                </select>

                <select id="filtre-difficulte" class="select-filtre">
                    <option value="">Toutes les difficultés</option>
                    <option value="Facile">Facile</option>
                    <option value="Moyenne">Moyenne</option>
                    <option value="Difficile">Difficile</option>
                </select>

                <select id="filtre-temps" class="select-filtre">
                    <option value="">Tous les temps</option>
                    <option value="<30min">Moins de 30 min</option>
                    <option value="<1h">Moins de 1h</option>
                    <option value=">1h">Plus de 1h</option>
                </select>

                <select id="filtre-piquant" class="select-filtre">
                    <option value="">Niveau de piquant</option>
                    <option value="1">Pas piquant</option>
                    <option value="2">Peu piquant</option>
                    <option value="3">Moyennement piquant</option>
                    <option value="4">Très piquant</option>
                    <option value="5">🔥 Hardcore 🔥</option>
                </select>

                <select id="filtre-budget" class="select-filtre">
                    <option value="">Tous les budgets</option>
                    <option value="1">Petit budget</option>
                    <option value="2">Budget moyen</option>
                    <option value="3">Grand budget</option>
                </select>

                <label class="checkbox-filtre">
                    <input type="checkbox" id="filtre-vege"> Végétarien
                </label>

                <label class="checkbox-filtre">
                    <input type="checkbox" id="filtre-likees"> ❤️ Mes recettes likées
                </label>
            </div>
        </div>

        <p class="compte-resultats" id="compte-resultats"></p>

        <div class="conteneur-tableau">
            <table id="tableau-recettes">
                <thead>
                    <tr>
                        <th data-tri="rec_nom">Nom</th>
                        <th data-tri="rec_pays">Pays</th>
                        <th data-tri="rec_difficulte">Difficulté</th>
                        <th data-tri="rec_temps">Temps</th>
                        <th data-tri="rec_hotness">Piquant</th>
                        <th data-tri="rec_budget">Budget</th>
                        <th data-tri="rec_vege">Végétarien</th>
                        <th>Allergènes</th>
                        <th data-tri="rec_likes">Likes</th>
                        <th>J'aime</th>
                    </tr>
                </thead>

                <tbody id="corps-tableau">
                    <!-- Les recettes s'affichent ici -->
                </tbody>
            </table>
        </div>
    </main>

    <footer>
        <nav class="navigation-footer">
            <a href="index.html">Accueil</a>
            <a href="carte.html">Carte</a>
            <a href="liste.html">Recettes</a>
            <a href="stats.html">Classement</a>
            <a href="aPropos.html">À propos</a>
        </nav>
        <p>&copy; 2026 - Projet TI504N - Recettes du Monde</p>
    </footer>

    <div id="modale-fond" class="modale-fond">
        <div class="modale-contenu">
            <button class="modale-fermer" id="modale-fermer">&times;</button>
            <div id="modale-corps"></div>
        </div>
    </div>

    <script src="../js/liste.js"></script>
</body>
</html>
