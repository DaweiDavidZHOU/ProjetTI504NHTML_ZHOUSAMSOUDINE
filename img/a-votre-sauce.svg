<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250">
  <title>Vue de dessus d'une table : un carnet de recettes ouvert, une casserole de sauce tomate, des ingrédients et des épices</title>

  <!-- Table en bois clair, vue de dessus -->
  <rect width="400" height="250" fill="#ecd3ad"/>
  <g stroke="#d9b98c" stroke-width="2">
    <path d="M0 62 H400 M0 125 H400 M0 188 H400"/>
  </g>
  <g stroke="#e2c497" stroke-width="1.5" fill="none" opacity=".8">
    <path d="M20 30 q60 -6 120 0 t120 0"/>
    <path d="M180 95 q50 -5 100 0 t100 0"/>
    <path d="M10 158 q70 -6 140 0"/>
    <path d="M220 220 q60 -6 120 0"/>
  </g>

  <!-- Carnet de recettes ouvert -->
  <g transform="translate(88 128) rotate(-7)">
    <rect x="-78" y="-86" width="156" height="172" rx="8" fill="#000" opacity=".14" transform="translate(5 6)"/>
    <rect x="-78" y="-86" width="156" height="172" rx="8" fill="#2c5f2d"/>
    <rect x="-72" y="-80" width="70" height="160" rx="3" fill="#fffdf8"/>
    <rect x="2" y="-80" width="70" height="160" rx="3" fill="#fbf8ef"/>
    <rect x="-4" y="-80" width="8" height="160" fill="#e6e0d2"/>
    <!-- page de gauche : photo du plat + texte -->
    <rect x="-64" y="-70" width="54" height="44" rx="4" fill="#97bc62"/>
    <circle cx="-37" cy="-48" r="15" fill="#fffdf8"/>
    <circle cx="-37" cy="-48" r="10" fill="#d9472f"/>
    <circle cx="-40" cy="-51" r="3" fill="#fff7e6"/><circle cx="-33" cy="-45" r="3" fill="#fff7e6"/>
    <ellipse cx="-36" cy="-52" rx="3" ry="1.6" fill="#3f8a3a"/>
    <g stroke="#c9c1ae" stroke-width="3" stroke-linecap="round">
      <path d="M-64 -14 H-12"/><path d="M-64 -2 H-20"/><path d="M-64 10 H-14"/><path d="M-64 22 H-24"/>
      <path d="M-64 40 H-12"/><path d="M-64 52 H-26"/><path d="M-64 64 H-18"/>
    </g>
    <!-- page de droite : liste de courses cochée -->
    <path d="M12 -66 H58" stroke="#2c5f2d" stroke-width="5" stroke-linecap="round"/>
    <g stroke-linecap="round" fill="none">
      <rect x="12" y="-48" width="11" height="11" rx="2" stroke="#2c5f2d" stroke-width="2"/>
      <path d="M14 -43 l3 3 l6 -7" stroke="#d89c24" stroke-width="2.5"/>
      <path d="M30 -42 H60" stroke="#c9c1ae" stroke-width="3"/>
      <rect x="12" y="-28" width="11" height="11" rx="2" stroke="#2c5f2d" stroke-width="2"/>
      <path d="M14 -23 l3 3 l6 -7" stroke="#d89c24" stroke-width="2.5"/>
      <path d="M30 -22 H56" stroke="#c9c1ae" stroke-width="3"/>
      <rect x="12" y="-8" width="11" height="11" rx="2" stroke="#2c5f2d" stroke-width="2"/>
      <path d="M14 -3 l3 3 l6 -7" stroke="#d89c24" stroke-width="2.5"/>
      <path d="M30 -2 H60" stroke="#c9c1ae" stroke-width="3"/>
      <rect x="12" y="12" width="11" height="11" rx="2" stroke="#2c5f2d" stroke-width="2"/>
      <path d="M30 18 H52" stroke="#c9c1ae" stroke-width="3"/>
      <rect x="12" y="32" width="11" height="11" rx="2" stroke="#2c5f2d" stroke-width="2"/>
      <path d="M30 38 H58" stroke="#c9c1ae" stroke-width="3"/>
    </g>
    <!-- marque-page -->
    <path d="M44 -86 V-56 l6 -6 l6 6 V-86Z" fill="#e63946"/>
  </g>

  <!-- Casserole de sauce tomate -->
  <g transform="translate(245 122)">
    <!-- manche -->
    <g transform="rotate(80)">
      <rect x="56" y="-9" width="96" height="18" rx="9" fill="#000" opacity=".14" transform="translate(4 -5)"/>
      <rect x="56" y="-9" width="96" height="18" rx="9" fill="#2f3640"/>
      <circle cx="138" cy="0" r="4" fill="#ecd3ad"/>
    </g>
    <circle r="66" fill="#000" opacity=".15" transform="translate(6 7)"/>
    <circle r="66" fill="#454c57"/>
    <circle r="58" fill="#2f3640"/>
    <circle r="54" fill="#b8301c"/>
    <!-- sauce : remous et reflets -->
    <path d="M-34 -6 q14 -26 40 -18 q26 10 18 34 q-10 22 -34 16 q-20 -6 -14 -24" fill="none" stroke="#d9472f" stroke-width="7" stroke-linecap="round"/>
    <path d="M-20 -30 q10 -6 22 -4" stroke="#ee7a5e" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="26" cy="-26" r="3" fill="#ee7a5e"/>
    <circle cx="-30" cy="24" r="2.5" fill="#ee7a5e"/>
    <circle cx="34" cy="20" r="2" fill="#ee7a5e"/>
    <!-- feuilles de basilic -->
    <ellipse cx="6" cy="2" rx="12" ry="6" fill="#4f9e45" transform="rotate(-30 6 2)"/>
    <ellipse cx="16" cy="10" rx="10" ry="5" fill="#3f8a3a" transform="rotate(40 16 10)"/>
    <path d="M-2 6 L14 -2" stroke="#2f6e2a" stroke-width="1.2"/>
    <!-- cuillère en bois -->
    <g transform="translate(-14 -14) rotate(150)">
      <rect x="-3.5" y="10" width="7" height="96" rx="3.5" fill="#b07a45"/>
      <ellipse cx="0" cy="0" rx="11" ry="15" fill="#c48a53"/>
      <ellipse cx="0" cy="0" rx="7" ry="10" fill="#c4552a" opacity=".55"/>
    </g>
  </g>

  <!-- Petits bols d'épices -->
  <g>
    <circle cx="331" cy="42" r="19" fill="#000" opacity=".12" transform="translate(3 4)"/>
    <circle cx="331" cy="42" r="19" fill="#fffdf8"/>
    <circle cx="331" cy="42" r="14" fill="#c4402a"/>
    <circle cx="327" cy="38" r="4" fill="#d9583a"/>

    <circle cx="373" cy="50" r="17" fill="#000" opacity=".12" transform="translate(3 4)"/>
    <circle cx="373" cy="50" r="17" fill="#fffdf8"/>
    <circle cx="373" cy="50" r="12" fill="#e9a91f"/>
    <circle cx="370" cy="47" r="3.5" fill="#f4c44a"/>

    <circle cx="352" cy="92" r="16" fill="#000" opacity=".12" transform="translate(3 4)"/>
    <circle cx="352" cy="92" r="16" fill="#fffdf8"/>
    <circle cx="352" cy="92" r="11" fill="#5a4a3c"/>
    <g fill="#2a2420">
      <circle cx="348" cy="88" r="2.2"/><circle cx="355" cy="89" r="2.2"/><circle cx="351" cy="95" r="2.2"/>
      <circle cx="357" cy="96" r="2.2"/><circle cx="346" cy="95" r="2.2"/>
    </g>
  </g>

  <!-- Planche à découper avec les ingrédients -->
  <g transform="translate(350 192) rotate(8)">
    <rect x="-50" y="-38" width="100" height="76" rx="12" fill="#000" opacity=".14" transform="translate(4 6)"/>
    <rect x="-50" y="-38" width="100" height="76" rx="12" fill="#d9a86a"/>
    <path d="M-40 -20 H40 M-42 0 H42 M-40 20 H38" stroke="#c4925a" stroke-width="1.5" opacity=".7"/>
    <!-- deux moitiés de tomate -->
    <circle cx="-24" cy="-12" r="17" fill="#d9362a"/>
    <circle cx="-24" cy="-12" r="13" fill="#f06b52"/>
    <g fill="#ffd9a8"><ellipse cx="-29" cy="-15" rx="3" ry="4.5"/><ellipse cx="-19" cy="-15" rx="3" ry="4.5"/><ellipse cx="-24" cy="-5" rx="4.5" ry="3"/></g>
    <circle cx="-24" cy="-12" r="3" fill="#f8a888"/>
    <circle cx="10" cy="-18" r="15" fill="#d9362a"/>
    <circle cx="10" cy="-18" r="11" fill="#f06b52"/>
    <g fill="#ffd9a8"><ellipse cx="6" cy="-21" rx="2.6" ry="4"/><ellipse cx="14" cy="-21" rx="2.6" ry="4"/><ellipse cx="10" cy="-12" rx="4" ry="2.6"/></g>
    <!-- tête d'ail -->
    <circle cx="26" cy="14" r="14" fill="#f7f2e6" stroke="#ddd3bf" stroke-width="2"/>
    <path d="M26 0 V28 M14 8 Q26 14 38 8 M14 20 Q26 14 38 20" stroke="#ddd3bf" stroke-width="1.6" fill="none"/>
    <!-- brin d'herbes -->
    <path d="M-36 24 L-2 14" stroke="#3f7a2e" stroke-width="2"/>
    <g fill="#4f9e45">
      <ellipse cx="-28" cy="18" rx="7" ry="3.5" transform="rotate(-50 -28 18)"/>
      <ellipse cx="-26" cy="28" rx="7" ry="3.5" transform="rotate(30 -26 28)"/>
      <ellipse cx="-14" cy="14" rx="7" ry="3.5" transform="rotate(-50 -14 14)"/>
      <ellipse cx="-12" cy="24" rx="7" ry="3.5" transform="rotate(30 -12 24)"/>
      <ellipse cx="-2" cy="11" rx="6" ry="3" transform="rotate(-20 -2 11)"/>
    </g>
  </g>

  <!-- Petits détails éparpillés -->
  <circle cx="176" cy="222" r="10" fill="#d9362a"/>
  <circle cx="173" cy="219" r="3" fill="#f07a62"/>
  <path d="M176 212 l2 -5" stroke="#3f7a2a" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="200" cy="236" rx="9" ry="4.5" fill="#4f9e45" transform="rotate(-20 200 236)"/>
  <ellipse cx="300" cy="20" rx="8" ry="4" fill="#4f9e45" transform="rotate(30 300 20)"/>
  <g fill="#2a2420">
    <circle cx="318" cy="118" r="2"/><circle cx="326" cy="128" r="2"/><circle cx="306" cy="132" r="1.8"/>
  </g>
  <g fill="#ffffff" opacity=".9">
    <rect x="390" y="104" width="3" height="3"/><rect x="383" y="112" width="3" height="3"/><rect x="394" y="118" width="2.5" height="2.5"/>
  </g>
</svg>
