<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250">
  <title>Vue de dessus d'une table : une carte du monde dépliée, avec de petits plats posés sur leurs pays</title>

  <!-- Table en bois clair, vue de dessus -->
  <rect width="400" height="250" fill="#ecd3ad"/>
  <g stroke="#d9b98c" stroke-width="2">
    <path d="M0 62 H400 M0 125 H400 M0 188 H400"/>
  </g>
  <g stroke="#e2c497" stroke-width="1.5" fill="none" opacity=".8">
    <path d="M300 30 q40 -5 80 0"/>
    <path d="M310 158 q40 -5 80 0"/>
    <path d="M10 236 q60 -6 120 0"/>
  </g>

  <!-- Carte du monde dépliée -->
  <g transform="translate(160 122) rotate(-4)">
    <rect x="-140" y="-100" width="280" height="200" rx="4" fill="#000" opacity=".15" transform="translate(6 8)"/>
    <rect x="-140" y="-100" width="280" height="200" rx="4" fill="#fffdf8"/>
    <rect x="-132" y="-92" width="264" height="184" fill="#cfe5ea"/>
    <!-- plis du papier -->
    <path d="M-44 -100 V100 M44 -100 V100 M-140 0 H140" stroke="#a9cbd4" stroke-width="1.5" opacity=".7"/>
    <rect x="-44" y="-92" width="88" height="184" fill="#000" opacity=".03"/>

    <!-- continents -->
    <g fill="#97bc62" stroke="#7fa34e" stroke-width="1.5">
      <path d="M-118 -62 q24 -20 62 -14 q26 8 30 26 q-10 12 -26 14 q-12 16 -28 18 q-16 -4 -24 -18 q-20 -8 -14 -26z"/>
      <path d="M-62 2 q16 -4 24 10 q6 22 -4 40 q-10 18 -16 26 q-8 -12 -10 -30 q-6 -24 6 -46z"/>
      <path d="M-14 -66 q18 -14 36 -4 q4 12 -6 18 q-16 4 -26 0 q-8 -4 -4 -14z"/>
      <path d="M-10 -30 q26 -8 44 8 q8 22 -2 44 q-10 24 -24 28 q-14 -14 -18 -34 q-10 -24 0 -46z"/>
      <path d="M36 -70 q46 -18 96 -6 q8 12 2 30 q-12 14 -36 12 q-16 16 -34 12 q-22 -6 -32 -20 q-14 -12 4 -28z"/>
      <path d="M86 30 q20 -8 36 2 q8 14 -4 24 q-18 8 -32 0 q-10 -12 0 -26z"/>
    </g>

    <!-- itinéraire en pointillés -->
    <path d="M-86 -42 Q-40 -96 4 -54 Q40 -20 92 -50" fill="none" stroke="#d89c24" stroke-width="3" stroke-dasharray="6 6" stroke-linecap="round"/>
    <path d="M4 -54 Q20 0 6 20" fill="none" stroke="#d89c24" stroke-width="3" stroke-dasharray="6 6" stroke-linecap="round"/>

    <!-- rose des vents -->
    <g transform="translate(-104 66)">
      <circle r="16" fill="#fffdf8" opacity=".8"/>
      <path d="M0 -14 L4 0 L0 14 L-4 0Z" fill="#2c5f2d"/>
      <path d="M-14 0 L0 -4 L14 0 L0 4Z" fill="#97bc62"/>
    </g>
  </g>

  <!-- Petits plats posés sur la carte -->
  <!-- Mexique : tacos -->
  <g transform="translate(78 82)">
    <circle r="24" fill="#000" opacity=".14" transform="translate(3 4)"/>
    <circle r="24" fill="#fffdf8"/>
    <circle r="18" fill="#fffdf8" stroke="#ece6d8" stroke-width="2"/>
    <path d="M-15 -2 a15 13 0 0 0 30 0 Z" fill="#e6b85c"/>
    <path d="M-13 -2 q4 -7 8 -2 q4 -8 9 -2 q4 -7 9 0 Z" fill="#5fae45"/>
    <circle cx="-5" cy="-3" r="3" fill="#9c4a2a"/><circle cx="4" cy="-4" r="3" fill="#b5562e"/>
    <rect x="-1" y="-9" width="4" height="4" fill="#f6c933"/>
  </g>
  <!-- Italie : pizza -->
  <g transform="translate(166 66)">
    <circle r="24" fill="#000" opacity=".14" transform="translate(3 4)"/>
    <circle r="24" fill="#fffdf8"/>
    <circle r="18" fill="#e9b673"/>
    <circle r="14" fill="#d9472f"/>
    <circle cx="-5" cy="-4" r="4" fill="#fff7e6"/><circle cx="5" cy="3" r="4" fill="#fff7e6"/><circle cx="-3" cy="6" r="3" fill="#fff7e6"/>
    <ellipse cx="3" cy="-6" rx="4" ry="2" fill="#3f8a3a" transform="rotate(-30 3 -6)"/>
  </g>
  <!-- Japon : sushis -->
  <g transform="translate(252 74)">
    <circle r="24" fill="#000" opacity=".14" transform="translate(3 4)"/>
    <circle r="24" fill="#fffdf8"/>
    <g>
      <circle cx="-8" cy="-2" r="8" fill="#1d2b22"/><circle cx="-8" cy="-2" r="6" fill="#fbfaf4"/><circle cx="-8" cy="-2" r="2.6" fill="#f08a5d"/>
      <circle cx="8" cy="-2" r="8" fill="#1d2b22"/><circle cx="8" cy="-2" r="6" fill="#fbfaf4"/><circle cx="8" cy="-2" r="2.6" fill="#7cbf5a"/>
      <circle cx="0" cy="11" r="8" fill="#1d2b22"/><circle cx="0" cy="11" r="6" fill="#fbfaf4"/><circle cx="0" cy="11" r="2.6" fill="#f08a5d"/>
    </g>
  </g>
  <!-- Maroc : tajine vu de dessus -->
  <g transform="translate(172 138)">
    <circle r="21" fill="#000" opacity=".14" transform="translate(3 4)"/>
    <circle r="21" fill="#a8432f"/>
    <circle r="16" fill="#c8553d"/>
    <circle r="10" fill="#d9704f"/>
    <circle r="5" fill="#a8432f"/>
    <path d="M0 -16 V-11 M0 11 V16 M-16 0 H-11 M11 0 H16" stroke="#f6e7c8" stroke-width="2"/>
  </g>

  <!-- Serviette pliée avec couverts -->
  <g transform="translate(352 140) rotate(4)">
    <rect x="-34" y="-74" width="68" height="148" rx="6" fill="#000" opacity=".12" transform="translate(4 5)"/>
    <rect x="-34" y="-74" width="68" height="148" rx="6" fill="#2c5f2d"/>
    <g stroke="#3d7a3e" stroke-width="6">
      <path d="M-34 -50 H34 M-34 -20 H34 M-34 10 H34 M-34 40 H34"/>
      <path d="M-14 -74 V74 M14 -74 V74"/>
    </g>
    <!-- fourchette -->
    <rect x="-14" y="-20" width="7" height="82" rx="3.5" fill="#e4e7ec"/>
    <rect x="-17" y="-34" width="13" height="18" rx="4" fill="#e4e7ec"/>
    <path d="M-16 -50 V-32 M-12.5 -50 V-32 M-9 -50 V-32 M-5.5 -50 V-32" stroke="#e4e7ec" stroke-width="2.5" stroke-linecap="round"/>
    <!-- couteau -->
    <rect x="7" y="0" width="7" height="62" rx="3.5" fill="#e4e7ec"/>
    <path d="M7 2 V-52 q8 4 8 24 V2Z" fill="#f2f4f7"/>
  </g>

  <!-- Verre d'eau vu de dessus -->
  <circle cx="360" cy="34" r="22" fill="#000" opacity=".1" transform="translate(3 4)"/>
  <circle cx="360" cy="34" r="22" fill="#e6f2f5" opacity=".9"/>
  <circle cx="360" cy="34" r="22" fill="none" stroke="#c4dde4" stroke-width="3"/>
  <path d="M348 26 q8 -8 18 -6" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Petits détails -->
  <ellipse cx="300" cy="226" rx="9" ry="4.5" fill="#4f9e45" transform="rotate(-25 300 226)"/>
  <circle cx="20" cy="210" r="9" fill="#d9362a"/><circle cx="17" cy="207" r="3" fill="#f07a62"/>
</svg>
