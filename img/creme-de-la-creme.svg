<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250">
  <title>Un podium où trois plats reçoivent des cœurs de la communauté</title>
  <defs>
    <radialGradient id="halo" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#fff6d6"/>
      <stop offset="1" stop-color="#f0f5e9"/>
    </radialGradient>
  </defs>
  <rect width="400" height="250" fill="url(#halo)"/>
  <!-- rayons de lumière derrière le podium -->
  <g fill="#f6e7b0" opacity=".6">
    <path d="M200 120 L120 0 H160Z"/><path d="M200 120 L200 0 H240Z"/><path d="M200 120 L280 0 H320Z"/>
    <path d="M200 120 L40 0 H80Z"/><path d="M200 120 L360 0 H400Z"/>
  </g>
  <!-- sol -->
  <ellipse cx="200" cy="236" rx="180" ry="12" fill="#000" opacity=".1"/>
  <!-- podium -->
  <rect x="140" y="140" width="120" height="96" rx="6" fill="#2c5f2d"/>
  <rect x="40" y="170" width="100" height="66" rx="6" fill="#3d7a3e"/>
  <rect x="260" y="188" width="100" height="48" rx="6" fill="#4d8a4a"/>
  <text x="200" y="202" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#d9f99d" text-anchor="middle">1</text>
  <text x="90" y="216" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#d9f99d" text-anchor="middle">2</text>
  <text x="310" y="224" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#d9f99d" text-anchor="middle">3</text>
  <!-- 1re place : gâteau -->
  <ellipse cx="200" cy="138" rx="46" ry="7" fill="#fffdf8"/>
  <rect x="166" y="104" width="68" height="32" rx="6" fill="#6b3a1c"/>
  <rect x="166" y="114" width="68" height="7" fill="#fbf2dc"/>
  <rect x="176" y="80" width="48" height="26" rx="6" fill="#7a4424"/>
  <path d="M176 86 q6 8 12 0 q6 8 12 0 q6 8 12 0 q6 8 12 0 v-6 h-48z" fill="#fbf2dc"/>
  <circle cx="200" cy="74" r="7" fill="#c8283a"/><path d="M200 67 q4 -8 10 -10" stroke="#3f7a2a" stroke-width="2.5" fill="none"/>
  <!-- 2e place : pizza -->
  <ellipse cx="90" cy="166" rx="40" ry="7" fill="#fffdf8"/>
  <ellipse cx="90" cy="152" rx="40" ry="14" fill="#e9b673"/>
  <ellipse cx="90" cy="150" rx="33" ry="10" fill="#d9472f"/>
  <ellipse cx="80" cy="148" rx="7" ry="3.5" fill="#fff7e6"/><ellipse cx="100" cy="151" rx="7" ry="3.5" fill="#fff7e6"/><ellipse cx="90" cy="146" rx="4" ry="2" fill="#3f8a3a"/>
  <!-- 3e place : bol de ramen -->
  <ellipse cx="310" cy="174" rx="30" ry="7" fill="#e9b35f"/>
  <path d="M312 172 q4 -8 8 0 t8 0" stroke="#fbe7a6" stroke-width="2.5" fill="none"/>
  <ellipse cx="298" cy="172" rx="7" ry="4" fill="#fffaf0"/><ellipse cx="298" cy="172" rx="3.5" ry="2" fill="#f2a516"/>
  <path d="M280 174 H340 A30 22 0 0 1 280 174Z" fill="#d9472f"/>
  <!-- cœurs qui montent -->
  <g fill="#e63946">
    <path d="M150 70 c-6 -8 -18 -2 -12 8 l12 12 l12 -12 c6 -10 -6 -16 -12 -8z"/>
    <path d="M258 52 c-5 -6 -14 -1 -9 6 l9 9 l9 -9 c5 -7 -4 -12 -9 -6z" opacity=".85"/>
    <path d="M118 112 c-4 -5 -11 -1 -7 5 l7 7 l7 -7 c4 -6 -3 -10 -7 -5z" opacity=".7"/>
    <path d="M286 118 c-4 -5 -11 -1 -7 5 l7 7 l7 -7 c4 -6 -3 -10 -7 -5z" opacity=".75"/>
    <path d="M226 30 c-3 -4 -8 -1 -5 3 l5 5 l5 -5 c3 -4 -2 -7 -5 -3z" opacity=".6"/>
  </g>
  <!-- confettis -->
  <g>
    <rect x="70" y="40" width="8" height="4" fill="#d89c24" transform="rotate(30 74 42)"/>
    <rect x="330" y="70" width="8" height="4" fill="#97bc62" transform="rotate(-20 334 72)"/>
    <rect x="110" y="20" width="6" height="3" fill="#97bc62" transform="rotate(60 113 21)"/>
    <rect x="300" y="24" width="7" height="4" fill="#d89c24" transform="rotate(10 303 26)"/>
    <circle cx="350" cy="120" r="3" fill="#d89c24"/>
    <circle cx="50" cy="110" r="3" fill="#e63946"/>
    <circle cx="176" cy="40" r="2.5" fill="#2c5f2d"/>
  </g>
</svg>
